name: Release sorbet-static (hint)

on:
  push:
    tags: ['hint-v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      upstream: ${{ steps.version.outputs.upstream }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          git fetch --no-tags https://github.com/sorbet/sorbet.git master:upstream-master
          base=$(git merge-base HEAD upstream-master)
          prefix=$(.buildkite/tools/sorbet-version-prefix.sh)
          upstream="${prefix}.$(git rev-list --count "$base")"
          tagged="${GITHUB_REF_NAME#hint-v}"
          if [[ ! "$tagged" =~ ^${upstream//./\\.}\.[0-9]+$ ]]; then
            echo "::error::Tag says $tagged; it must be the upstream base $upstream plus a release number, e.g. $upstream.1"
            exit 1
          fi
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "version=$tagged" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk for Bazel
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - run: ./bazel build //main:sorbet --strip=always --config=release-linux
      - run: |
          mkdir -p gems/sorbet-static/libexec
          cp bazel-bin/main/sorbet gems/sorbet-static/libexec/sorbet
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Build gem
        working-directory: gems/sorbet-static
        run: |
          sed -i "s/0\\.0\\.0/${{ needs.version.outputs.version }}/" sorbet-static.gemspec
          gem build sorbet-static.gemspec
      - uses: actions/upload-artifact@v4
        with:
          name: gem-linux
          path: gems/sorbet-static/*.gem

  mac:
    needs: version
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf
      - run: |
          ./bazel build //main:sorbet --strip=always --config=release-mac
          cp bazel-bin/main/sorbet sorbet.darwin-arm64
          ./bazel build //main:sorbet --strip=always --config=release-mac --config=cross-to-darwin-x86_64
          cp bazel-bin/main/sorbet sorbet.darwin-x86_64
          mkdir -p gems/sorbet-static/libexec
          lipo -create -output gems/sorbet-static/libexec/sorbet sorbet.darwin-*
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Build gem
        working-directory: gems/sorbet-static
        run: |
          sed -i '' "s/0\\.0\\.0/${{ needs.version.outputs.version }}/" sorbet-static.gemspec
          sed -i '' "s/Gem::Platform::CURRENT/'universal-darwin'/" sorbet-static.gemspec
          gem build sorbet-static.gemspec
      - uses: actions/upload-artifact@v4
        with:
          name: gem-mac
          path: gems/sorbet-static/*.gem

  publish:
    needs: [version, linux, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KEEP_VERSIONS: 6
      VERSION: ${{ needs.version.outputs.version }}
      UPSTREAM: ${{ needs.version.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          path: new
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Build sorbet and sorbet-static-and-runtime
        run: |
          (cd src/gems/sorbet && sed -i "s/0\\.0\\.0/$VERSION/g" sorbet.gemspec && gem build sorbet.gemspec)
          (cd src/gems/sorbet-static-and-runtime \
            && sed -i "s/'sorbet-runtime', '0\\.0\\.0'/'sorbet-runtime', '$UPSTREAM'/" sorbet-static-and-runtime.gemspec \
            && sed -i "s/0\\.0\\.0/$VERSION/g" sorbet-static-and-runtime.gemspec \
            && gem build sorbet-static-and-runtime.gemspec)
          mv src/gems/sorbet/*.gem src/gems/sorbet-static-and-runtime/*.gem new/
      - name: Build the gem index
        run: |
          mkdir -p index/gems
          cp site/gems/*.gem index/gems/ 2>/dev/null || true
          cp new/*.gem index/gems/
          ruby -e '
            versions = Dir["index/gems/*.gem"]
              .group_by { File.basename(it, ".gem")[/-(\d+(?:\.\d+)+)(?:-|\z)/, 1] }
            keep = versions.keys.sort_by { Gem::Version.new(it) }.last(Integer(ENV.fetch("KEEP_VERSIONS")))
            versions.each { |version, files| File.delete(*files) unless keep.include?(version) }
          '
          gem install rubygems-generate_index --no-document
          gem generate_index --directory index
          touch index/.nojekyll
      - name: Publish to gh-pages
        working-directory: index
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "sorbet-static ${GITHUB_REF_NAME#hint-v}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
